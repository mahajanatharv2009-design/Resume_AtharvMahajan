name: Sync GitHub Projects

on:
  schedule:
    - cron: "0 5 * * "
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-projects:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update generated projects
        env:
          GITHUB_OWNERS: Atharvamaj,mahajanatharv2009-design
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-github-projects.mjs

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update portfolio projects from GitHub
          file_pattern: generated-projects.js
