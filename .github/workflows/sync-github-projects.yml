name: Sync GitHub Projects

on:
  workflow_dispatch:
    inputs:
      bot_action:
        description: "Choose what the GitHub project bot should do"
        required: true
        default: "sync_once"
        type: choice
        options:
          - sync_once
          - stop_bot
          - start_bot
          - reset_projects
          - status_only

permissions:
  contents: write

jobs:
  github-project-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Stop bot manually
        if: ${{ github.event.inputs.bot_action == 'stop_bot' }}
        run: node scripts/set-github-bot-status.mjs stop

      - name: Start bot manually
        if: ${{ github.event.inputs.bot_action == 'start_bot' }}
        run: node scripts/set-github-bot-status.mjs start

      - name: Reset generated projects
        if: ${{ github.event.inputs.bot_action == 'reset_projects' }}
        run: node scripts/set-github-bot-status.mjs reset

      - name: Show bot status
        if: ${{ github.event.inputs.bot_action == 'status_only' }}
        run: node scripts/set-github-bot-status.mjs status

      - name: Sync GitHub projects once
        if: ${{ github.event.inputs.bot_action == 'sync_once' }}
        env:
          GITHUB_OWNERS: Atharvamaj,mahajanatharv2009-design
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-github-projects.mjs

      - name: Commit bot status or project changes
        if: ${{ github.event.inputs.bot_action != 'status_only' }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: GitHub project bot manual update
          file_pattern: generated-projects.js portfolio-bot-instructions.json
